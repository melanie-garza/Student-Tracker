spring.application.name=student-tracker 
# Conexión a la base de datos MySQL/MariaDB
spring.datasource.url=jdbc:mysql://localhost:3306/english_school?serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de Hibernate (crea la tabla automáticamente)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect